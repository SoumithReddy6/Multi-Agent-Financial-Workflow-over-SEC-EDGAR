name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Force the deterministic lexical embedder in CI so tests stay fast and
      # offline (no model download). Production/local runs default to semantic.
      EMBEDDING_BACKEND: hash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run offline workflow benchmark
        run: python scripts/evaluate_workflow.py --offline --queries data/sample_queries.jsonl --output artifacts/evaluation_metrics.json

      - name: Run retrieval benchmark (lexical backend)
        run: python scripts/evaluate_retrieval.py --backend hash --output artifacts/retrieval_metrics.json
