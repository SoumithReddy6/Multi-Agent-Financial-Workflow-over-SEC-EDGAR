[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-memo-agents"
version = "0.1.0"
description = "Multi-agent financial workflow over SEC EDGAR filings."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Soumith Reddy Padigapati" }]
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=1.26.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.1",
  "requests>=2.32.0",
  "tenacity>=8.4.0",
]

[project.optional-dependencies]
llm = ["openai>=1.50.0", "anthropic>=0.39.0"]
rag = ["faiss-cpu>=1.8.0", "langchain>=0.3.0", "langchain-community>=0.3.0", "langchain-openai>=0.2.0", "langgraph>=0.2.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "uvicorn[standard]>=0.30.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["sec_memo_agents*"]
