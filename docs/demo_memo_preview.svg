<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">SEC EDGAR investment memo demo screenshot</title>
  <desc id="desc">A stylized preview of the FastAPI workflow output for an Apple SEC filing investment memo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07151f"/>
      <stop offset="48%" stop-color="#0e2a32"/>
      <stop offset="100%" stop-color="#25310f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f3e7"/>
      <stop offset="100%" stop-color="#e6dcc7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace; }
      .sans { font-family: "Avenir Next", "Segoe UI", sans-serif; }
      .tiny { font-size: 20px; }
      .small { font-size: 24px; }
      .medium { font-size: 32px; }
      .large { font-size: 46px; font-weight: 800; }
      .muted { fill: #63706d; }
      .ink { fill: #17211f; }
      .green { fill: #2f6b4f; }
      .amber { fill: #9b6a17; }
      .line { stroke: #c9bea8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="1160" cy="80" r="190" fill="#d7b857" opacity="0.14"/>
  <circle cx="105" cy="685" r="220" fill="#70a98f" opacity="0.14"/>

  <g filter="url(#shadow)">
    <rect x="74" y="74" width="1132" height="612" rx="34" fill="url(#card)"/>
  </g>

  <rect x="112" y="116" width="1056" height="78" rx="20" fill="#17211f"/>
  <circle cx="152" cy="155" r="10" fill="#de6e56"/>
  <circle cx="184" cy="155" r="10" fill="#e4b84d"/>
  <circle cx="216" cy="155" r="10" fill="#6fbf73"/>
  <text x="258" y="164" class="mono small" fill="#f7efd9">POST /memos  ticker=AAPL  template=deal_screening</text>

  <text x="118" y="252" class="sans large ink">Investment Memo: Apple Inc.</text>
  <text x="118" y="290" class="sans small muted">SEC 10-K filed 2024-11-01 | CIK 0000320193 | Workflow: Deal Screening</text>

  <rect x="118" y="330" width="228" height="104" rx="22" fill="#dce8d4"/>
  <text x="144" y="372" class="sans tiny muted">Recommendation</text>
  <text x="144" y="410" class="sans medium green">WATCHLIST</text>

  <rect x="374" y="330" width="228" height="104" rx="22" fill="#ece2c9"/>
  <text x="400" y="372" class="sans tiny muted">Confidence</text>
  <text x="400" y="410" class="sans medium amber">0.84</text>

  <rect x="630" y="330" width="228" height="104" rx="22" fill="#dce5e8"/>
  <text x="656" y="372" class="sans tiny muted">Schema Valid</text>
  <text x="656" y="410" class="sans medium green">TRUE</text>

  <rect x="886" y="330" width="228" height="104" rx="22" fill="#eadbd3"/>
  <text x="912" y="372" class="sans tiny muted">Citations</text>
  <text x="912" y="410" class="sans medium ink">2 SOURCES</text>

  <line x1="118" y1="476" x2="1114" y2="476" class="line"/>

  <text x="118" y="528" class="sans medium ink">Key Financials</text>
  <text x="118" y="570" class="mono small muted">Revenue        $391.04B     FY2024</text>
  <text x="118" y="606" class="mono small muted">Net income      $93.74B     FY2024</text>
  <text x="118" y="642" class="mono small muted">Assets         $364.98B     FY2024</text>

  <text x="640" y="528" class="sans medium ink">Comparable Evidence</text>
  <text x="640" y="570" class="mono small muted">MSFT: cloud demand, operating leverage, AI capex</text>
  <text x="640" y="606" class="mono small muted">Risk: competition, regulation, supply chain</text>
  <text x="640" y="642" class="mono small muted">Output: Pydantic InvestmentMemo JSON</text>
</svg>
